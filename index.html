<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мульт ТВ — Эфир</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            text-align: center;
            padding: 20px;
            margin: 0;
        }
        h1 {
            font-size: 3.5rem;
            color: #f7c948;
            text-shadow: 0 0 20px rgba(247, 201, 72, 0.3);
            letter-spacing: 2px;
            margin-top: 10px;
            margin-bottom: 5px;
        }
        .live-badge {
            background-color: #ef4444;
            color: white;
            padding: 4px 14px;
            font-weight: bold;
            border-radius: 4px;
            font-size: 0.9rem;
            display: inline-block;
            margin-bottom: 10px;
            text-transform: uppercase;
            animation: blink 1.5s infinite;
        }
        @keyframes blink { 50% { opacity: 0.5; } }
        .subtitle {
            font-size: 1.2rem;
            color: #94a3b8;
            margin-bottom: 20px;
            font-weight: 500;
            min-height: 2rem;
        }
        .video-container {
            position: relative;
            width: 850px;
            max-width: 100%;
            height: 480px;
            margin: 0 auto;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
        }
        iframe {
            width: 100% !important;
            height: 480px !important;
            border: none;
            display: block;
        }
        .controls {
            margin-top: 20px;
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }
        .btn {
            background-color: #0284c7;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.2s ease;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        .btn:hover { background-color: #0369a1; transform: translateY(-1px); }
        .tv-badge {
            position: absolute;
            top: 15px;
            left: 18px;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(3px);
            padding: 6px 16px;
            border-radius: 40px;
            border-left: 4px solid #f7c948;
            color: white;
            font-weight: 600;
            font-size: 0.8rem;
            z-index: 35;
            pointer-events: none;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .tv-badge span {
            background: #f7c948;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
            animation: pulse-dot 1.6s infinite;
        }
        @keyframes pulse-dot {
            0% { opacity: 0.5; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.2); }
            100% { opacity: 0.5; transform: scale(0.8); }
        }
        @media (max-width: 600px) {
            h1 { font-size: 2.2rem; }
            .video-container { height: 280px; }
            iframe { height: 280px !important; }
            .controls .btn { padding: 8px 16px; font-size: 0.8rem; }
        }
    </style>
</head>
<body>

    <h1>Мульт ТВ</h1>
    <div class="live-badge">Прямой эфир</div>
    <div class="subtitle" id="currentTrack">Загрузка эфира...</div>

    <div class="video-container" id="videoContainer">
        <div class="tv-badge"><span></span> Мульт ТВ</div>
        <iframe id="tv-player" allow="autoplay; fullscreen" allowfullscreen></iframe>
    </div>

    <div class="controls">
        <button class="btn" id="muteBtn">🔇 Включить звук</button>
        <button class="btn" id="fullscreenBtn">📺 Полный экран</button>
    </div>

    <script>
        // ============================================================
        //  ТВОЙ ПЛЕЙЛИСТ — ДОБАВЛЯЙ СВОИ ВИДЕО ЗДЕСЬ
        //  id       = код из ссылки YouTube (например, из youtu.be/ABCD123)
        //  title    = название, которое показывается внизу экрана
        //  duration = длительность в СЕКУНДАХ (можно приблизительно, нужно для расписания)
        // ============================================================
        const playlist = [
            { id: 'sX6nHlE_yfA', title: 'Смешарики · Пин-код', duration: 1440 },
            { id: 'By99z7i4Y3E', title: 'Маша и Медведь · Первая встреча', duration: 4264 },
            { id: 'lJbqLxvPwzU', title: 'Фиксики · Батарейки', duration: 3591 },
            { id: '4nT3rXkRnv0', title: 'Лунтик · Друзья', duration: 1200 },
            { id: 'G9ZlPGdO3xg', title: 'Три кота · Мульт-концерт', duration: 1800 },
            { id: 'xV_6h3N8MkI', title: 'Барбоскины · Новый год', duration: 1500 },
            { id: 'r8Wc5zQl3Vw', title: 'Щенячий патруль · Гонки', duration: 1400 },
            { id: 'nJq9KpLmY2Q', title: 'Ми-ми-мишки · Путешествие', duration: 1300 },
            // ↓↓↓ ВСТАВЛЯЙ СВОИ ВИДЕО В ЭТОМ ЖЕ ФОРМАТЕ ↓↓↓
            // { id: 'ТВОЙ_ID', title: 'Название видео', duration: 120 },
        ];
        // ============================================================

        // Общая длительность всего плейлиста (в секундах)
        const totalDuration = playlist.reduce((sum, item) => sum + item.duration, 0);

        let isMuted = true;
        let lastLoadedVideoId = "";
        const player = document.getElementById('tv-player');
        const currentTrack = document.getElementById('currentTrack');

        // Функция формирования URL для плеера
        function getVideoUrl(id, start = 0) {
            const muteParam = isMuted ? 1 : 0;
            return `https://www.youtube.com/embed/${id}?autoplay=1&start=${start}&mute=${muteParam}&controls=0&enablejsapi=1&rel=0&modestbranding=1&playsinline=1`;
        }

        // Загрузка конкретного видео с таймкодом
        function loadVideo(id, start = 0, title = '') {
            if (lastLoadedVideoId !== id) {
                lastLoadedVideoId = id;
                player.src = getVideoUrl(id, start);
                if (title) currentTrack.textContent = title;
            }
        }

        // Основная функция обновления эфира (вызывается каждую секунду)
        function updateBroadcast() {
            const currentTimestamp = Math.floor(Date.now() / 1000);
            let timeInCycle = currentTimestamp % totalDuration;
            let currentMovie = null;

            for (let i = 0; i < playlist.length; i++) {
                if (timeInCycle < playlist[i].duration) {
                    currentMovie = {
                        id: playlist[i].id,
                        title: playlist[i].title,
                        startFrom: Math.floor(timeInCycle)
                    };
                    break;
                }
                timeInCycle -= playlist[i].duration;
            }

            if (currentMovie) {
                loadVideo(currentMovie.id, currentMovie.startFrom, 'Сейчас в эфире: ' + currentMovie.title);
            }
        }

        // Запускаем эфир
        updateBroadcast();
        setInterval(updateBroadcast, 1000);

        // ========== УПРАВЛЕНИЕ ЗВУКОМ ==========
        document.getElementById('muteBtn').addEventListener('click', function() {
            isMuted = !isMuted;
            this.innerHTML = isMuted ? "🔇 Включить звук" : "🔊 Выключить звук";
            // Перезагружаем текущее видео с новым параметром mute
            const currentSrc = player.src;
            if (currentSrc) {
                const url = new URL(currentSrc);
                url.searchParams.set('mute', isMuted ? '1' : '0');
                player.src = url.toString();
            }
        });

        // ========== ПОЛНЫЙ ЭКРАН ==========
        document.getElementById('fullscreenBtn').addEventListener('click', function() {
            const container = document.getElementById('videoContainer');
            if (!document.fullscreenElement) {
                container.requestFullscreen().catch(err => {
                    alert('Ошибка: ' + err.message);
                });
            } else {
                document.exitFullscreen();
            }
        });
    </script>
</body>
</html>
