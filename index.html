<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мульт ТВ — Эфир</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            text-align: center;
            padding: 20px;
            margin: 0;
        }
        h1 {
            font-size: 3.5rem;
            color: #f7c948;
            text-shadow: 0 0 20px rgba(247, 201, 72, 0.3);
            letter-spacing: 2px;
            margin-top: 10px;
            margin-bottom: 5px;
        }
        .live-badge {
            background-color: #ef4444;
            color: white;
            padding: 4px 14px;
            font-weight: bold;
            border-radius: 4px;
            font-size: 0.9rem;
            display: inline-block;
            margin-bottom: 10px;
            text-transform: uppercase;
            animation: blink 1.5s infinite;
        }
        @keyframes blink { 50% { opacity: 0.5; } }
        .subtitle {
            font-size: 1.2rem;
            color: #94a3b8;
            margin-bottom: 20px;
            font-weight: 500;
            min-height: 2rem;
        }
        .video-container {
            position: relative;
            width: 850px;
            max-width: 100%;
            height: 480px;
            margin: 0 auto;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
        }
        iframe {
            width: 100% !important;
            height: 480px !important;
            border: none;
            display: block;
        }
        .controls {
            margin-top: 20px;
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }
        .btn {
            background-color: #0284c7;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.2s ease;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        .btn:hover { background-color: #0369a1; transform: translateY(-1px); }
        .tv-badge {
            position: absolute;
            top: 15px;
            left: 18px;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(3px);
            padding: 6px 16px;
            border-radius: 40px;
            border-left: 4px solid #f7c948;
            color: white;
            font-weight: 600;
            font-size: 0.8rem;
            z-index: 35;
            pointer-events: none;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .tv-badge span {
            background: #f7c948;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
            animation: pulse-dot 1.6s infinite;
        }
        @keyframes pulse-dot {
            0% { opacity: 0.5; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.2); }
            100% { opacity: 0.5; transform: scale(0.8); }
        }
        .online-counter {
            margin-top: 30px;
            font-size: 1.1rem;
            color: #94a3b8;
            background: #1e293b;
            display: inline-block;
            padding: 8px 20px;
            border-radius: 20px;
            border: 1px solid #334155;
        }
        .online-number {
            color: #22c55e;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(34, 197, 94, 0.2);
        }
        @media (max-width: 600px) {
            h1 { font-size: 2.2rem; }
            .video-container { height: 280px; }
            iframe { height: 280px !important; }
            .controls .btn { padding: 8px 16px; font-size: 0.8rem; }
        }
    </style>
</head>
<body>

    <h1>Мульт ТВ</h1>
    <div class="live-badge">Прямой эфир</div>
    <div class="subtitle" id="currentTrack">Загрузка эфира...</div>

    <div class="video-container" id="videoContainer">
        <div class="tv-badge"><span></span> Мульт ТВ</div>
        <iframe id="tv-player" allow="autoplay; fullscreen" allowfullscreen></iframe>
    </div>

    <div class="controls">
        <button class="btn" id="muteBtn">🔇 Включить звук</button>
        <button class="btn" id="fullscreenBtn">📺 Полный экран</button>
    </div>

    <div class="online-counter">
        👀 Онлайн: <span class="online-number" id="onlineCount">Загрузка...</span> чел.
    </div>

    <script>
        // ================================================================
        //  ╔══════════════════════════════════════════════════════════════╗
        //  ║   👇👇👇  СЮДА ВСТАВЛЯЙТЕ СВОИ ВИДЕО  👇👇👇              ║
        //  ║                                                              ║
        //  ║  Формат:  { id: 'КОД_ИЗ_ССЫЛКИ', title: 'Название', duration: СЕКУНДЫ } ║
        //  ║                                                              ║
        //  ║  КАК ПОЛУЧИТЬ ID:                                           ║
        //  ║  • Из ссылки вида https://youtu.be/ABCD123  → берём ABCD123 ║
        //  ║  • Из ссылки вида https://www.youtube.com/watch?v=ABCD123 → берём ABCD123 ║
        //  ║                                                              ║
        //  ║  duration (длительность) — можно указать приблизительно,     ║
        //  ║  это нужно только для расписания эфира (в секундах).        ║
        //  ║  Например, для 5-минутного видео: duration: 300            ║
        //  ║                                                              ║
        //  ║  ПРИМЕР:                                                     ║
        //  ║  { id: 'dQw4w9WgXcQ', title: 'Мой ролик', duration: 120 }   ║
        //  ╚══════════════════════════════════════════════════════════════╝
        // ================================================================

        const playlist = [
            // ----- ВАШИ ВИДЕО (ДОБАВЛЯЙТЕ СЮДА) -----
            // { id: 'ВАШ_КОД', title: 'НАЗВАНИЕ', duration: ДЛИТЕЛЬНОСТЬ_В_СЕКУНДАХ },
            
            // Примеры (можно удалить или заменить):
            { id: 'byMMXeq0CcQ', title: 'Рик и Морти', duration: 1440 },
            { id: '_23N3DmBRXk', title: 'Маша и Медведь', duration: 4264 },
            { id: 'J5S3tU_mbi0', title: 'Симпсоны', duration: 3591 }
        ];

        // ================================================================
        //  НИЖЕ НИЧЕГО НЕ ТРОГАЙТЕ — ЭТО РАБОТА ПЛЕЕРА
        // ================================================================

        // Заставка (можно заменить на свою, если хотите)
        const introId = 'UbY3QIM69Ho';
        const introDuration = 11;

        const totalDuration = playlist.reduce((sum, item) => sum + item.duration, 0);

        let isMuted = true;
        let lastLoadedVideoId = "";
        const player = document.getElementById('tv-player');
        const currentTrack = document.getElementById('currentTrack');

        function getVideoUrl(id, start = 0) {
            const muteParam = isMuted ? 1 : 0;
            return `https://www.youtube.com/embed/${id}?autoplay=1&start=${start}&mute=${muteParam}&controls=0&enablejsapi=1&rel=0&modestbranding=1&playsinline=1`;
        }

        function loadVideo(id, start = 0, title = '') {
            if (lastLoadedVideoId !== id) {
                lastLoadedVideoId = id;
                player.src = getVideoUrl(id, start);
                if (title) currentTrack.textContent = title;
            }
        }

        function updateBroadcast() {
            const now = new Date();
            const minutes = now.getMinutes();
            const seconds = now.getSeconds();

            if ((minutes === 0 || minutes === 30) && seconds < introDuration) {
                loadVideo(introId, 0, '📺 Заставка Мульт ТВ');
                return;
            }

            if (playlist.length === 0) {
                // Если плейлист пуст — показываем сообщение
                currentTrack.textContent = 'Добавьте видео в плейлист!';
                return;
            }

            const currentTimestamp = Math.floor(Date.now() / 1000);
            let timeInCycle = currentTimestamp % totalDuration;
            let currentMovie = null;

            for (let i = 0; i < playlist.length; i++) {
                if (timeInCycle < playlist[i].duration) {
                    currentMovie = {
                        id: playlist[i].id,
                        title: playlist[i].title,
                        startFrom: Math.floor(timeInCycle)
                    };
                    break;
                }
                timeInCycle -= playlist[i].duration;
            }

            if (currentMovie) {
                loadVideo(currentMovie.id, currentMovie.startFrom, 'Сейчас в эфире: ' + currentMovie.title);
            }
        }

        // Счётчик зрителей (как в "Ветре")
        function initOnlineCounter() {
            if (!sessionStorage.getItem('multtv_device_token')) {
                const token = Math.random().toString(36).substring(2, 11) + Date.now().toString(36);
                sessionStorage.setItem('multtv_device_token', token);
            }
            const deviceToken = sessionStorage.getItem('multtv_device_token');
            const counterUrl = `https://leandrosn.com${deviceToken}`;

            function fetchCount() {
                fetch(counterUrl)
                    .then(res => res.json())
                    .then(data => {
                        document.getElementById('onlineCount').textContent = data.online || 1;
                    })
                    .catch(() => {
                        document.getElementById('onlineCount').textContent = Math.floor(Math.random() * 5) + 1;
                    });
            }

            fetchCount();
            setInterval(fetchCount, 5000);
        }
        initOnlineCounter();

        // Запускаем эфир
        updateBroadcast();
        setInterval(updateBroadcast, 1000);

        // Звук
        document.getElementById('muteBtn').addEventListener('click', function() {
            isMuted = !isMuted;
            this.innerHTML = isMuted ? "🔇 Включить звук" : "🔊 Выключить звук";
            const currentSrc = player.src;
            if (currentSrc) {
                const url = new URL(currentSrc);
                url.searchParams.set('mute', isMuted ? '1' : '0');
                player.src = url.toString();
            }
        });

        // Полный экран
        document.getElementById('fullscreenBtn').addEventListener('click', function() {
            const container = document.getElementById('videoContainer');
            if (!document.fullscreenElement) {
                container.requestFullscreen().catch(err => {
                    alert('Ошибка: ' + err.message);
                });
            } else {
                document.exitFullscreen();
            }
        });
    </script>
</body>
</html>
